name: wine-cellar-dev

services:
  web:
    build: .
    command: >
      sh -c "npm run watch & exec python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/usr/src/app
      # The bind mount above masks whatever the image built at these paths.
      # Without this, node_modules disappears, `npm run watch` dies instantly,
      # and every page using a bundled asset 500s (e.g. /wine/add/).
      - /usr/src/app/node_modules
    # Stays on 0.0.0.0: the bot's links point at the Tailscale address
    # (web_url in scanner config.yaml), and Tailscale is not 127.0.0.1.
    ports:
      - 0.0.0.0:8000:8000
    env_file:
      - ./.env.dev
    environment:
      - CONTAINER_ROLE=web
    depends_on:
      - db
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    # Not published. Nothing outside the compose network talks to Postgres —
    # the scanner reaches the app over the shared docker network, not the DB.
    # Re-add `ports: ["127.0.0.1:5434:5432"]` if you want a local DB client.
    expose:
      - 5432
    environment:
      - POSTGRES_USER=wino
      - POSTGRES_PASSWORD=wino_dev
      - POSTGRES_DB=wino_dev
    restart: unless-stopped
  redis:
    image: redis:alpine
    restart: unless-stopped
  celery:
    build: .
    command: celery -A wine_cellar.conf worker -l info
    # Same bind mount as `web`. Without it the workers run whatever was baked
    # into the image, so task changes silently never took effect — a restart
    # could not pick them up, only a rebuild.
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./.env.dev
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  celery-beat:
    build: .
    # Keep beat's schedule DB out of the bind-mounted source tree.
    command: celery -A wine_cellar.conf beat -l info --schedule /tmp/celerybeat-schedule
    # Same bind mount as `web`. Without it the workers run whatever was baked
    # into the image, so task changes silently never took effect — a restart
    # could not pick them up, only a rebuild.
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./.env.dev
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
